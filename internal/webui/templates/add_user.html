{{define "add_user"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Add New User</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 40px;
                background: #f7f9fb;
            }
            .form-container {
                max-width: 350px;
                margin: 40px auto;
                background: #fff;
                padding: 24px;
                border-radius: 10px;
                box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
            }
            label {
                font-weight: 600;
            }
            input {
                width: 100%;
                padding: 8px;
                margin-top: 6px;
                margin-bottom: 16px;
                border-radius: 6px;
                border: 1px solid #bbb;
                font-size: 1rem;
            }
            button {
                background: #1976d2;
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 10px 18px;
                font-size: 1rem;
                cursor: pointer;
            }
            button:hover,
            button:focus {
                background: #125ea2;
            }
            .error {
                color: #c62828;
                margin-bottom: 12px;
            }
            a {
                color: #1976d2;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
        <script>
            function validateForm(event) {
                const pwd = document.getElementById("password").value;
                const confirm = document.getElementById("confirm").value;
                const errorDiv = document.getElementById("error");
                if (pwd !== confirm) {
                    errorDiv.textContent = "Passwords do not match!";
                    event.preventDefault();
                    return false;
                }
                errorDiv.textContent = "";
                return true;
            }
        </script>
    </head>
    <body>
        <div class="form-container">
            <h2>Add New User</h2>
            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}
            <form
                method="POST"
                action="/admin/new"
                onsubmit="return validateForm(event)"
            >
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="username"
                    value="{{.Email}}"
                />
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="new-password"
                />
                <label for="confirm">Confirm Password:</label>
                <input
                    type="password"
                    id="confirm"
                    name="confirm"
                    required
                    autocomplete="new-password"
                />
                <div id="error" class="error"></div>
                <button type="submit">Add User</button>
            </form>
            <p><a href="/admin">Back to user list</a></p>
        </div>
    </body>
</html>
{{end}}
